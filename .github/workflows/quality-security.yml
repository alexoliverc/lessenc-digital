name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_URL: https://lessenc.invalid
      P08_PRODUCT_ID: 11111111-1111-4111-8111-111111111111
      P08_OFFER_ID: 22222222-2222-4222-8222-222222222222
      P09_SUBMISSION_SECRET: ci-only-fictitious-p09-secret-32-characters
      P10_PAYMENT_CONTINUATION_SECRET: ci-only-fictitious-p10-secret-32-characters
      P11_BUYER_SESSION_SECRET: ci-only-fictitious-p11-secret-32-characters
      P12_ADMIN_AUTH_SECRET: ci-only-fictitious-p12-secret-32-characters
      PRIVATE_FILE_STORAGE_PATH: /tmp/lessenc-private

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up canonical Node and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and application tests
        run: npm run test

      - name: Audit complete dependency graph
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
